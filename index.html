    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrado:', reg.scope))
                    .catch(err => console.error('SW erro:', err));
            });
        }
        
        document.addEventListener('click', function(e) {
            if (e.target.closest('#logout-btn')) {
                e.preventDefault();
                if(typeof logout === 'function') logout();
            }
        });

        window.addEventListener('online', () => {
            if (window.showToast) window.showToast('Conexao restaurada!', 'success');
        });
        
        window.addEventListener('offline', () => {
            if (window.showToast) window.showToast('Sem conexao com a internet', 'error');
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('Erro:', event.reason);
            if (window.showToast) window.showToast('Ops! Algo deu errado. Tente novamente.', 'error');
        });
    </script>
    
    <!-- ==================== -->
    <!-- SCRIPTS - NÃO MUDE A ORDEM -->
    <!-- ==================== -->
    
    <!-- 1. Backend local (offline, 100% sem depender de projeto Firebase real) -->
    <!-- Para voltar a usar o Firebase real, troque esta linha pelos 3 scripts do CDN do Firebase compat -->

    <!-- Gráficos, PDF e Excel -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- 2. Firebase Config (DEVE vir logo após os CDNs) -->
